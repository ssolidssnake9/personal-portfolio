name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: HTML tag-balance check
        run: |
          python - <<'EOF'
          import re, sys
          from html.parser import HTMLParser
          VOID = {'area','base','br','col','embed','hr','img','input','link','meta','param','source','track','wbr'}
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True); self.stack=[]; self.errs=[]
              def handle_starttag(self, t, a):
                  if t not in VOID: self.stack.append((t, self.getpos()))
              def handle_endtag(self, t):
                  if t in VOID: return
                  if self.stack and self.stack[-1][0]==t: self.stack.pop()
                  else: self.errs.append(f"mismatch </{t}> at {self.getpos()}, open: {[s[0] for s in self.stack[-3:]]}")
          p=P()
          src=open('index.html').read()
          p.feed(src)
          if p.stack: p.errs.append(f"unclosed: {[s[0] for s in p.stack]}")
          if p.errs:
              print("\n".join(p.errs)); sys.exit(1)
          print("index.html tags balanced")
          EOF
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
      - uses: actions/dependency-review-action@e7aeea1772ec01da74cafda11c5caa463520ca59 # v4
      - name: Audit Actions workflows with zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
